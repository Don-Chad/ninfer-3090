<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img"
     aria-label="NInfer-3090 throughput on one RTX 3090: prefill 3,185 tok/s; decode one stream 140-295 tok/s; decode all lanes 383-477 tok/s">
  <title>NInfer-3090 throughput, one RTX 3090</title>
  <style>
    .nb-surface  { fill: #fcfcfb; }
    .nb-border   { stroke: rgba(11,11,11,0.10); }
    .nb-primary  { fill: #0b0b0b; }
    .nb-secondary{ fill: #52514e; }
    .nb-muted    { fill: #898781; }
    .nb-hair     { stroke: #e1e0d9; }
    .nb-baseline { stroke: #c3c2b7; }
    .nb-s1       { fill: #2a78d6; }
    .nb-s2       { fill: #eb6834; }
    .nb-dashed   { stroke: #898781; fill: none; stroke-dasharray: 4 3; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .nb-surface  { fill: #1a1a19; }
      .nb-border   { stroke: rgba(255,255,255,0.10); }
      .nb-primary  { fill: #ffffff; }
      .nb-secondary{ fill: #c3c2b7; }
      .nb-muted    { fill: #898781; }
      .nb-hair     { stroke: #2c2c2a; }
      .nb-baseline { stroke: #383835; }
      .nb-s1       { fill: #3987e5; }
      .nb-s2       { fill: #d95926; }
    }
  </style>

  <rect x="1" y="1" width="958" height="298" rx="16" class="nb-surface nb-border" stroke-width="1"/>

  <!-- legend -->
  <rect x="36" y="20" width="14" height="14" rx="3" class="nb-s1"/>
  <text x="56" y="31" font-size="13" font-weight="600" class="nb-primary">Qwen3.8-27B &#8212; dense</text>
  <rect x="236" y="20" width="14" height="14" rx="3" class="nb-s2"/>
  <text x="256" y="31" font-size="13" font-weight="600" class="nb-primary">Qwen3.6-35B-A3B &#8212; MoE</text>

  <!-- subtitle -->
  <text x="36" y="50" font-size="12" class="nb-muted">tok/s on one RTX 3090 &#183; 27B: this fork&#8217;s conversion, re-measured 2026-10-02 (8 chat prompts, INT8 KV; prefill rk4v4)</text>

  <line x1="36" y1="64" x2="924" y2="64" class="nb-hair" stroke-width="1"/>

  <!-- Panel 1: Prefill -->
  <g>
    <text x="36" y="112" font-size="15" font-weight="600" class="nb-primary">Prefill &#183; 4K prompt</text>
    <line x1="56" y1="122" x2="56" y2="204" class="nb-baseline" stroke-width="1"/>

    <rect x="36" y="20" width="0" height="0" opacity="0"/>
    <!-- dense: 3,185 tok/s, full scale -->
    <rect x="56" y="128" width="190" height="22" rx="4" class="nb-s1"/>
    <text x="256" y="143" font-size="13" class="nb-secondary">3,185 tok/s</text>
    <text x="256" y="158" font-size="10" class="nb-muted">opt-in cuBLAS route</text>

    <!-- MoE: not yet measured -->
    <rect x="56" y="168" width="90" height="22" rx="4" class="nb-dashed" stroke-width="1"/>
    <text x="160" y="183" font-size="13" font-style="italic" class="nb-muted">not yet measured</text>
    <text x="160" y="198" font-size="10" class="nb-muted">on a 3090</text>
  </g>

  <!-- Panel 2: Decode, one stream -->
  <g>
    <text x="340" y="112" font-size="15" font-weight="600" class="nb-primary">Decode &#183; one stream</text>
    <line x1="360" y1="122" x2="360" y2="204" class="nb-baseline" stroke-width="1"/>

    <!-- dense: 140 tok/s (of 295 max) -->
    <rect x="360" y="128" width="90" height="22" rx="4" class="nb-s1"/>
    <text x="460" y="143" font-size="13" class="nb-secondary">140 tok/s</text>
    <text x="460" y="158" font-size="10" class="nb-muted">DFlash2</text>

    <!-- MoE: 295 tok/s (max) -->
    <rect x="360" y="168" width="190" height="22" rx="4" class="nb-s2"/>
    <text x="560" y="183" font-size="13" class="nb-secondary">295 tok/s</text>
    <text x="560" y="198" font-size="10" class="nb-muted">MTP3 + draft head</text>
  </g>

  <!-- Panel 3: Decode, all lanes -->
  <g>
    <text x="644" y="112" font-size="15" font-weight="600" class="nb-primary">Decode &#183; all lanes (max)</text>
    <line x1="664" y1="122" x2="664" y2="204" class="nb-baseline" stroke-width="1"/>

    <!-- dense: 477 tok/s (max) -->
    <rect x="664" y="128" width="190" height="22" rx="4" class="nb-s1"/>
    <text x="864" y="143" font-size="13" class="nb-secondary">477 tok/s</text>
    <text x="864" y="158" font-size="10" class="nb-muted">C8 &#183; MTP3</text>

    <!-- MoE: 383 tok/s (of 477 max) -->
    <rect x="664" y="168" width="153" height="22" rx="4" class="nb-s2"/>
    <text x="827" y="183" font-size="13" class="nb-secondary">383 tok/s</text>
    <text x="827" y="198" font-size="10" class="nb-muted">C6 &#183; MTP3</text>
  </g>

  <!-- footer -->
  <text x="36" y="280" font-size="11" class="nb-muted">Qwen3.6-35B-A3B prefill not yet benchmarked on a 3090 &#8212; see docs/performance for full methodology.</text>
  <text x="924" y="280" font-size="11" text-anchor="end" class="nb-muted">ashalliants/ninfer-3090</text>
</svg>
